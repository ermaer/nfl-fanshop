<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>NFL Fan Shop – Team T-Shirts & Dresses for All 32 Teams</title>
    <meta name="description" content="Shop premium NFL fan gear for all 32 teams. Browse our collection of team t-shirts ($34.99) and women's game-day dresses ($59.99). Rep your colors in style on game day." />
    <meta name="keywords" content="NFL merchandise, NFL t-shirts, NFL dresses, NFL fan gear, NFL apparel, football fan shop, NFL team shirts, cheap NFL shirts, NFL jersey, game day outfit, women NFL dress, NFL clothing" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="google-site-verification" content="REPLACE_WITH_YOUR_GSC_VERIFICATION_CODE" />
    <meta name="msvalidate.01" content="REPLACE_WITH_YOUR_BING_VERIFICATION_CODE" />
    <link rel="canonical" href="%VITE_BASE_URL%" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NFL Fan Shop" />
    <meta property="og:title" content="NFL Fan Shop – Team T-Shirts & Dresses for All 32 Teams" />
    <meta property="og:description" content="Premium NFL fan gear for all 32 teams. Shop team t-shirts and women's game-day dresses. Rep your colors in style." />
    <meta property="og:url" content="%VITE_BASE_URL%" />
    <meta property="og:image" content="%VITE_BASE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NFLFanShop" />
    <meta name="twitter:title" content="NFL Fan Shop – Team T-Shirts & Dresses for All 32 Teams" />
    <meta name="twitter:description" content="Premium NFL fan gear for all 32 teams. Shop team t-shirts and women's game-day dresses." />
    <meta name="twitter:image" content="%VITE_BASE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="NFL Fan Shop – Premium team apparel for all 32 NFL franchises" />

    <!-- JSON-LD Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NFL Fan Shop",
      "url": "%VITE_BASE_URL%",
      "description": "Premium NFL fan gear for all 32 teams — team t-shirts and women's game-day dresses.",
      "foundingDate": "2026",
      "logo": "%VITE_BASE_URL%/og-image.png",
      "sameAs": [
        "https://twitter.com/NFLFanShop"
      ]
    }
    </script>

    <!-- JSON-LD Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NFL Fan Shop",
      "url": "%VITE_BASE_URL%",
      "description": "Premium NFL fan gear for all 32 teams — team t-shirts and women's game-day dresses.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "%VITE_BASE_URL%/shop?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
